<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Monitor</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0c10;
            --surface: #111418;
            --border: #1e2329;
            --border-hi: #2e3540;
            --text: #e8edf5;
            --muted: #5a6478;
            --accent: #00e5a0;
            --accent-dim: rgba(0, 229, 160, .12);
            --warn: #f0a500;
            --danger: #ff4d6d;
            --font-head: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 14px;
            --transition: .22s cubic-bezier(.4, 0, .2, 1);
        }

        html,

        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-head);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: .025;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 28px 60px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 36px 0 40px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 48px;
            animation: fadeDown .5s ease both;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--accent-dim);
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            display: grid;
            place-items: center;
        }

        .logo-icon svg {
            width: 18px;
            height: 18px;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent);
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: .72rem;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 6px 14px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            transition: background var(--transition);
        }

        .status-dot.live {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .wallet-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: border-color var(--transition), transform var(--transition);
            animation: fadeUp .5s ease both;
        }

        .wallet-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .wallet-card.updated::before {
            opacity: 1;
        }

        .wallet-card:hover {
            border-color: var(--border-hi);
            transform: translateY(-2px);
        }

        .card-label {
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: .65rem;
            font-family: var(--font-mono);
            background: var(--accent-dim);
            color: var(--accent);
            border-radius: 6px;
            padding: 3px 8px;
        }

        .balance-wrap {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 20px;
        }

        .currency {
            font-size: .85rem;
            font-weight: 600;
            color: var(--muted);
        }

        .balance-value {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -.02em;
            font-variant-numeric: tabular-nums;
            color: var(--text);
            transition: color .3s ease;
        }

        .balance-value.flash {
            color: var(--accent);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: .65rem;
        }

        .conn-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            transition: background var(--transition);
            margin-right: 6px;
        }

        .conn-dot.connected {
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        .conn-dot.error {
            background: var(--danger);
            box-shadow: 0 0 6px var(--danger);
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .log-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeUp .5s .18s ease both;
            grid-column: span 2;
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid var(--border);
        }

        .log-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .btn-clear {
            font-family: var(--font-mono);
            font-size: .65rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            transition: color var(--transition);
        }

        .btn-clear:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            min-height: 300px;
        }

        .log-body::-webkit-scrollbar {
            width: 4px;
        }

        .log-body::-webkit-scrollbar-thumb {
            background: var(--border-hi);
            border-radius: 4px;
        }

        .log-entry {
            display: grid;
            grid-template-columns: 80px 28px 1fr;
            align-items: baseline;
            gap: 8px;
            padding: 6px 22px;
            font-family: var(--font-mono);
            font-size: .7rem;
            line-height: 1.4;
            border-left: 2px solid transparent;
            animation: slideIn .2s ease both;
            transition: background var(--transition);
        }

        .log-entry:hover {
            background: rgba(255, 255, 255, .025);
        }

        .log-entry.success {
            border-left-color: var(--accent);
        }

        .log-entry.info {
            border-left-color: #4fa3ff;
        }

        .log-entry.warning {
            border-left-color: var(--warn);
        }

        .log-entry.error {
            border-left-color: var(--danger);
        }

        .log-entry.transaction {
            border-left-color: #a78bfa;
        }

        .log-ts {
            color: var(--muted);
            font-size: .65rem;
        }

        .log-icon {
            text-align: center;
            font-size: .85rem;
            line-height: 1;
        }

        .log-msg {
            color: var(--text);
            word-break: break-word;
        }

        .log-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            font-family: var(--font-mono);
            font-size: .75rem;
        }

        @media (max-width: 1024px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .log-panel {
                grid-column: span 1;
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                        <rect x="2" y="5" width="20" height="14" rx="3" />
                        <path d="M16 12a2 2 0 0 1-4 0 2 2 0 0 1 4 0z" />
                    </svg>
                </div>
                <div class="logo-text">Wallet<span>Monitor</span></div>
            </div>
            <div class="status-pill">
                <span class="status-dot" id="global-dot"></span>
                <span id="global-status">Initializing…</span>
            </div>
        </header>

        <main>
            <div class="content-wrapper">
                <div class="wallets-grid" id="wallets-container">
                    <!-- Wallet cards will be dynamically generated here -->
                </div>

                <!-- Log Panel -->
                <div class="log-panel">
                    <div class="log-header">
                        <div class="log-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                            </svg>
                            Live Activity
                        </div>
                        <button class="btn-clear" id="btn-clear">Clear</button>
                    </div>
                    <div class="log-body" id="activity-log">
                        <div class="log-empty" id="log-empty">No events yet…</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ========== GLOBAL STATE ==========
        let allUsers = {};
        let wsConnections = {};
        let connectedCount = 0;
        let loggedTransactionIds = new Set();

        // ========== HELPERS ==========
        function ts() {
            return new Date().toLocaleTimeString('en-GB', { hour12: false });
        }

        function addLog(message, type = 'info') {
            const body = document.getElementById('activity-log');
            const empty = document.getElementById('log-empty');
            if (empty) empty.remove();

            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;

            const icons = {
                success: '✅',
                info: '📡',
                warning: '⚠️',
                error: '❌',
                transaction: '💸'
            };
            entry.innerHTML = `
                <span class="log-ts">${ts()}</span>
                <span class="log-icon">${icons[type] ?? '•'}</span>
                <span class="log-msg">${message}</span>
            `;
            body.prepend(entry);

            // Keep only last 100 entries
            if (body.children.length > 100) {
                body.removeChild(body.lastChild);
            }
        }

        // ========== CARD MANAGEMENT ==========
        function createWalletCard(user) {
            const card = document.createElement('div');
            card.className = 'wallet-card';
            card.id = `card-${user.username}`;
            card.innerHTML = `
                <div class="card-label">Wallet Balance</div>
                <div class="card-name">
                    ${user.username}
                    <span class="user-badge">UID ${user.user_id}</span>
                </div>
                <div class="balance-wrap">
                    <span class="currency">₹</span>
                    <span class="balance-value" id="balance-${user.username}">—</span>
                </div>
                <div class="card-footer">
                    <span id="update-${user.username}" style="font-family: var(--font-mono); font-size: .65rem; color: var(--muted);">Awaiting…</span>
                    <div style="display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .65rem;">
                        <span class="conn-dot" id="dot-${user.username}"></span>
                        <span id="label-${user.username}" style="color: var(--muted)">connecting</span>
                    </div>
                </div>
            `;
            return card;
        }

        function flashCard(username, balance) {
            const card = document.getElementById(`card-${username}`);
            const balVal = document.getElementById(`balance-${username}`);
            const updateEl = document.getElementById(`update-${username}`);

            const balanceText = typeof balance === 'number' ? balance.toFixed(2) : balance;
            balVal.textContent = balanceText;
            balVal.classList.add('flash');
            card.classList.add('updated');

            setTimeout(() => {
                balVal.classList.remove('flash');
                card.classList.remove('updated');
            }, 900);

            updateEl.textContent = `Updated ${ts()}`;
        }

        function setConnState(username, state) {
            const dot = document.getElementById(`dot-${username}`);
            const label = document.getElementById(`label-${username}`);
            dot.className = 'conn-dot';

            const states = {
                connected: { cls: 'connected', text: 'live', color: 'var(--accent)' },
                error: { cls: 'error', text: 'error', color: 'var(--danger)' },
                closed: { cls: '', text: 'closed', color: 'var(--warn)' },
                connecting: { cls: '', text: 'connecting', color: 'var(--muted)' },
            };
            const s = states[state] || states.connecting;
            if (s.cls) dot.classList.add(s.cls);
            label.textContent = s.text;
            label.style.color = s.color;

            updateGlobalStatus();
        }

        function updateGlobalStatus() {
            connectedCount = document.querySelectorAll('.conn-dot.connected').length;
            const globalDot = document.getElementById('global-dot');
            const globalStatus = document.getElementById('global-status');
            const totalUsers = Object.keys(allUsers).length;

            if (totalUsers === 0) {
                globalStatus.textContent = 'No users';
                globalDot.className = 'status-dot';
            } else if (connectedCount === totalUsers) {
                globalDot.className = 'status-dot live';
                globalStatus.textContent = `All ${totalUsers} streams live`;
            } else if (connectedCount > 0) {
                globalDot.className = 'status-dot live';
                globalStatus.textContent = `${connectedCount} / ${totalUsers} connected`;
            } else {
                globalDot.className = 'status-dot';
                globalStatus.textContent = 'Disconnected';
            }
        }

        // ========== DATA LOADING ==========
        async function loadWallets() {
            try {
                const response = await fetch('/api/wallet-balances/');
                const data = await response.json();

                const container = document.getElementById('wallets-container');

                // First load - create cards
                if (Object.keys(allUsers).length === 0) {
                    addLog(`Loaded ${data.wallets.length} wallets`, 'success');

                    data.wallets.forEach(wallet => {
                        allUsers[wallet.username] = wallet;
                        const card = createWalletCard(wallet);
                        container.appendChild(card);
                        flashCard(wallet.username, wallet.balance);
                    });

                    // Connect WebSockets after cards are created
                    setTimeout(() => {
                        data.wallets.forEach(wallet => {
                            connectWebSocket(wallet.username, wallet.user_id);
                        });
                    }, 300);
                } else {
                    // Update - just refresh balances in place
                    data.wallets.forEach(wallet => {
                        if (allUsers[wallet.username]) {
                            const oldBalance = allUsers[wallet.username].balance;
                            if (Math.abs(oldBalance - wallet.balance) > 0.01) {
                                // Balance changed
                                allUsers[wallet.username] = wallet;
                                flashCard(wallet.username, wallet.balance);
                                addLog(`✓ Balance refreshed: ${wallet.username} → ₹${wallet.balance.toFixed(2)}`, 'success');
                            }
                        }
                    });
                }
            } catch (error) {
                addLog(`Error loading wallets: ${error.message}`, 'error');
            }
        }

        let lastTransactionCount = 0;
        let lastTransactionRefresh = 0;

        async function pollTransactions() {
            try {
                const response = await fetch('/api/transactions/activity/');
                const data = await response.json();

                if (data.transactions && data.transactions.length > 0) {
                    // Check if new transactions appeared AND it's been at least 1 second since last refresh
                    const now = Date.now();
                    if (data.transactions.length > lastTransactionCount && (now - lastTransactionRefresh) > 1000) {
                        lastTransactionCount = data.transactions.length;
                        lastTransactionRefresh = now;

                        // Refresh wallet balances on new transaction
                        await loadWallets();
                    }

                    // Process transactions in reverse order (oldest first)
                    // Only log transactions we haven't seen before
                    data.transactions.slice().reverse().forEach(txn => {
                        // Create unique ID from transaction data
                        const txnId = `${txn.sender}-${txn.receiver}-${txn.amount}-${txn.status}`;
                        
                        if (!loggedTransactionIds.has(txnId)) {
                            loggedTransactionIds.add(txnId);
                            const statusIcon = txn.status === 'SUCCESS' ? '✓' : txn.status === 'PENDING' ? '⏳' : '✗';
                            const typeLabel = `${txn.sender} → ${txn.receiver}`;
                            const type = txn.status === 'SUCCESS' ? 'transaction' : 'error';
                            addLog(`${statusIcon} ${typeLabel}: ₹${txn.amount.toFixed(2)} [${txn.status}]`, type);
                        }
                    });
                }
            } catch (error) {
                console.error('Error polling transactions:', error);
            }
        }

        // ========== WEBSOCKET ==========
        function connectWebSocket(username, userId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/wallet/${userId}/`;

            setConnState(username, 'connecting');

            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setConnState(username, 'connected');
                addLog(`📡 WebSocket connected: ${username}`, 'success');
                wsConnections[username] = ws;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.balance !== undefined) {
                        // Parse balance (might be string from Decimal)
                        const balance = parseFloat(data.balance);

                        // Update the user data
                        if (allUsers[username]) {
                            allUsers[username].balance = balance;
                            flashCard(username, balance);
                            addLog(`✓ Balance updated: ${username} → ₹${balance.toFixed(2)}`, 'success');
                        }
                    }
                    console.log(`WebSocket update received for ${username}:`, data);
                } catch (e) {
                    console.error('Parse error:', e);
                    addLog(`Error parsing WebSocket message: ${e.message}`, 'error');
                }
            };

            ws.onclose = () => {
                setConnState(username, 'closed');
                addLog(`⚠️  WebSocket closed: ${username}`, 'warning');
                delete wsConnections[username];
                // Reconnect after 3 seconds
                setTimeout(() => connectWebSocket(username, userId), 3000);
            };

            ws.onerror = (err) => {
                setConnState(username, 'error');
                addLog(`❌ WebSocket error: ${username}`, 'error');
                console.error(err);
            };
        }

        // ========== INITIALIZATION ==========
        document.getElementById('btn-clear').onclick = () => {
            document.getElementById('activity-log').innerHTML =
                '<div class="log-empty" id="log-empty">No events yet…</div>';
        };

        window.addEventListener('DOMContentLoaded', () => {
            addLog('Initializing dashboard...', 'info');
            loadWallets();

            // Poll transaction activity every 2 seconds
            setInterval(pollTransactions, 2000);
        });
    </script>
</body>

</html>
